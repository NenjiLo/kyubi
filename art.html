<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Camera Art</title>
    <link rel="stylesheet" href="style/art.css">
</head>
<body>
    <div class="camera-container">
        <div class="camera-body">

            <div class="camera-top">
                <div class="viewfinder"></div>
                <div class="shutter-button"></div>
                <div class="flash-mount"></div>
            </div>

            <div class="lens-outer">
                <div class="lens-middle">
                    <div class="lens-inner">
                        <div class="lens-reflection"></div>
                    </div>
            </div>

        </div>
    </div>
</body>
</html>
